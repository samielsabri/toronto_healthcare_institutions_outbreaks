<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toronto institutional outbreaks</title>
<script>/*__CHARTJS__*/</script>
<script>/*__LEAFLETJS__*/</script>
<style>/*__LEAFLETCSS__*/</style>
<style>
/* Layout: one screen, no page scroll on desktop: the map on the left and a
   tabbed panel on the right (same design as the project's other surveillance
   dashboards). */
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #ffffff; --border: #dedcd7; --grid: #eeede9;
  --text: #111110; --text-2: #52514e; --text-3: #7a7974;
  --accent: #2a78d6; --outline: #2b2b2a; --missing: #e4e3df; --signal: #d9480f;
  --band: #898781; --stale: #b26a00; --ok: #2e7d32;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
       display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }

/* Header: a fixed grid so switching filters never moves anything.
   Row 1: title | season | setting | type; row 2: the week slider. */
header { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto auto;
         grid-template-rows: auto auto; align-items: center; gap: 8px 12px;
         padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b, .brand > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand b { font-size: 15px; }
.brand > span { color: var(--text-3); font-size: 11px; }
.fresh { font-weight: 600; }
.fresh.ok { color: var(--ok); } .fresh.stale { color: var(--stale); }
#season { width: 100%; }
select, button { font: inherit; color: var(--text); background: var(--surface);
                 border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.week { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.week input { flex: 1; accent-color: var(--accent); }
.week output { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; min-width: 21ch; }
#play { width: 32px; cursor: pointer; }

main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
       gap: 12px; padding: 12px; min-height: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
        min-height: 0; display: flex; flex-direction: column; }

/* left: stats + map */
.stats { display: flex; gap: 0; border-bottom: 1px solid var(--grid); }
.stat { flex: 1; padding: 8px 12px; border-right: 1px solid var(--grid); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .k { color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .d { color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.maphead { padding: 8px 12px 0; font-weight: 600; }
#mapwrap { flex: 1; min-height: 0; padding: 4px 8px; position: relative; }
#lmap { width: 100%; height: 100%; border-radius: 6px; background: var(--grid); }
.leaflet-container { font: inherit; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 6px 12px 8px;
          font-size: 11px; color: var(--text-2); border-top: 1px solid var(--grid); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px;
       margin-right: 4px; border: 1.5px solid #fff; box-shadow: 0 0 0 1px var(--border); }
.dot.ring { border: 2.5px solid var(--outline); box-shadow: none; }
.sw { display: inline-block; width: 13px; height: 9px; vertical-align: -1px; margin-right: 4px; border-radius: 2px; }

/* right: tabs */
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
               padding: 7px 9px; cursor: pointer; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.panel { flex: 1; min-height: 0; padding: 10px 12px; display: none; flex-direction: column; }
.panel.on { display: flex; }
.panel h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
.hint { color: var(--text-3); font-size: 11px; }
.chart { flex: 1; min-height: 0; position: relative; margin-top: 6px; }
.scroll { flex: 1; min-height: 0; overflow: auto; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
td.n, th.n { text-align: right; }
td.nw { white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chips button { padding: 2px 8px; font-size: 11px; cursor: pointer; border-radius: 999px; }
.chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.row .grow { flex: 1; }
.dl { font-size: 11px; padding: 3px 8px; cursor: pointer; }
.src { color: var(--text-3); font-size: 11px; }
.open { color: var(--signal); font-weight: 600; }
a { color: var(--accent); }
#about h3 { font-size: 12px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); }
#about h3:first-child { margin-top: 0; }
#about p { margin: 4px 0; color: var(--text-2); }
#about ul { margin: 4px 0 0; padding-left: 18px; color: var(--text-2); }
#about li { margin-bottom: 4px; }
.status { display: flex; gap: 8px; margin-top: 6px; }
.status > div { flex: 1; border: 1px solid var(--grid); border-radius: 8px; padding: 6px 8px; }
.status .v { font-size: 16px; font-weight: 600; }

#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
       border-radius: 8px; padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
       display: none; z-index: 1000; max-width: 300px; }

@media (max-width: 900px) {   /* phones / narrow windows: stack and scroll */
  body { overflow: auto; display: block; }
  main { grid-template-columns: minmax(0, 1fr); }
  #mapwrap { height: 60vh; flex: none; }
  .card:last-child { height: 75vh; }
  header { grid-template-columns: minmax(0, 1fr); }
  .brand b, .brand > span { white-space: normal; }
  .seg { display: flex; width: 100%; }
  .seg button { flex: 1 1 0; padding: 5px 4px; }
  .week output { min-width: 0; font-size: 12px; }
  .stats { flex-wrap: wrap; }
  .stat { flex: 1 1 50%; border-bottom: 1px solid var(--grid); }
  .maphead { font-size: 12px; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Outbreaks in Toronto healthcare institutions</b>
    <span id="brand-sub"></span></div>
  <select id="season" aria-label="Respiratory season"></select>
  <div class="seg" role="group" aria-label="Setting" id="seg-setting"></div>
  <div class="seg" role="group" aria-label="Outbreak type" id="seg-type"></div>
  <div class="week">
    <button id="play" aria-label="Play weeks">▶</button>
    <input id="wk" type="range" step="1" aria-label="Week of the season">
    <output id="wklab"></output>
  </div>
</header>

<main>
  <section class="card">
    <div class="stats">
      <div class="stat"><div class="k" id="k-new"></div><div class="v" id="t-new">–</div><div class="d" id="t-new-d"></div></div>
      <div class="stat"><div class="k" id="k-act"></div><div class="v" id="t-act">–</div><div class="d" id="t-act-d"></div></div>
      <div class="stat"><div class="k" id="k-std"></div><div class="v" id="t-std">–</div><div class="d" id="t-std-d"></div></div>
      <div class="stat"><div class="k">Influenza season</div><div class="v" id="t-flu">–</div><div class="d" id="t-flu-d"></div></div>
    </div>
    <div class="maphead" id="map-title"></div>
    <div id="mapwrap"><div id="lmap"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="trend" aria-selected="true">Trend</button>
      <button role="tab" data-tab="agents" aria-selected="false">Pathogens</button>
      <button role="tab" data-tab="onset" aria-selected="false">Season onset</button>
      <button role="tab" data-tab="duration" aria-selected="false">Duration</button>
      <button role="tab" data-tab="recur" aria-selected="false">Repeat outbreaks</button>
      <button role="tab" data-tab="facility" aria-selected="false">Facility</button>
      <button role="tab" data-tab="table" aria-selected="false">Table</button>
      <button role="tab" data-tab="about" aria-selected="false">Methods</button>
    </div>
    <div class="panel on" id="p-trend"><h2 id="tr-title"></h2><div class="hint" id="tr-hint"></div>
      <div class="chips" id="tr-chips"></div>
      <div class="chart"><canvas id="c-trend"></canvas></div></div>
    <div class="panel" id="p-agents"><h2 id="ag-title"></h2><div class="hint" id="ag-hint"></div>
      <div class="chips" id="ag-chips"></div>
      <div class="chart"><canvas id="c-agents"></canvas></div></div>
    <div class="panel" id="p-onset"><h2 id="on-title"></h2><div class="hint" id="on-hint"></div>
      <div class="chips" id="on-chips"></div>
      <div class="status" id="on-status"></div>
      <div class="chart"><canvas id="c-onset"></canvas></div></div>
    <div class="panel" id="p-duration"><h2 id="du-title"></h2><div class="hint" id="du-hint"></div>
      <div class="chips" id="du-chips"></div>
      <div class="chart" style="flex:0 0 55%"><canvas id="c-duration"></canvas></div>
      <div class="scroll"><table id="du-tbl"></table></div></div>
    <div class="panel" id="p-recur"><h2>Facilities with repeat outbreak episodes</h2><div class="hint" id="re-hint"></div>
      <div class="chart" style="flex:0 0 55%"><canvas id="c-recur"></canvas></div>
      <div class="scroll"><table id="re-tbl"></table></div></div>
    <div class="panel" id="p-facility"><h2 id="fa-title"></h2><div class="hint" id="fa-hint"></div>
      <div class="chart" style="flex:0 0 38%"><canvas id="c-facility"></canvas></div>
      <div class="scroll"><table id="fa-tbl"></table></div></div>
    <div class="panel" id="p-table">
      <div class="row"><h2 id="tb-title" class="grow"></h2>
        <button class="dl" id="dl-sel">CSV: this selection</button><button class="dl" id="dl-all">CSV: all outbreaks</button></div>
      <div class="src" id="tb-src"></div>
      <div class="scroll"><table id="tbl"></table></div></div>
    <div class="panel" id="p-about"><div class="scroll" id="about"></div></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>

<script>
const DATA = /*__DATA__*/null;
const TILES = /*__TILES__*/null;
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmt = (v, d = 0) => v == null || !isFinite(v) ? "–"
  : v.toLocaleString("en-CA", {maximumFractionDigits: d, minimumFractionDigits: d});
const store = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
const day = s => s ? Date.parse(s + "T00:00:00") : null;
const fdate = ms => new Date(ms).toLocaleDateString("en-CA", {day: "numeric", month: "short", year: "numeric"});
const fdateShort = ms => new Date(ms).toLocaleDateString("en-CA", {day: "numeric", month: "short"});

// ── data ──────────────────────────────────────────────────────────────────
const O = DATA.outbreaks, F = DATA.facilities, CUR = DATA.current, CAL = DATA.calendar;
const N = O.fac.length, ASOF = day(DATA.as_of);
const BEGAN = O.began.map(day), OVER = O.over.map(day);
const SETTINGS = DATA.settings, SCOL = DATA.setting_colours;
const GROUPS = DATA.agent_groups;                       // bit i of flags = group i
const gi = name => GROUPS.indexOf(name);
const has = (i, name) => (O.flags[i] >> gi(name)) & 1;
const ENTERIC_MIX = ["Norovirus", "Other enteric pathogen", "Multiple agents", "Unknown"];
const ENTERIC_COL = ["#008300", "#6250d6", "#e87ba4", css("--band")];
const isCurrent = s => s === CUR.season_idx;
const lastWeek = s => isCurrent(s) ? CUR.week : 52;     // weeks run 1..52 (week 53 merged into 52)
const isoLabel = (s, w) => "W" + String(CAL[s].iso[w - 1]).padStart(2, "0");

const S = {season: CUR.season_idx, week: CUR.week, setting: -1, type: 0, tab: "trend", sel: null,
           base: "post", agView: "week", onAgent: "influenza", duView: "resp_setting"};

// Does outbreak i match the setting/type filters?
const inFilter = i => (S.setting < 0 || O.setting[i] === S.setting) && (S.type < 0 || O.type[i] === S.type);
// Weekly new outbreaks (by week of onset) for season s, under the filters (or a custom test).
function weekly(s, test = inFilter) {
  const out = new Array(52).fill(0);
  for (let i = 0; i < N; i++) if (O.season[i] === s && test(i)) out[O.week[i] - 1]++;
  return out.map((v, w) => w < lastWeek(s) ? v : null);
}
// Lowest, median and highest weekly count across the comparison seasons
// (decision D6): only season-weeks labelled with the period; never the season shown.
function range(period, exclude, test = inFilter) {
  const per = new Map();
  for (let s = 0; s < DATA.seasons.length; s++) {
    if (s === exclude || isCurrent(s)) continue;
    const wk = weekly(s, test);
    for (let w = 0; w < 52; w++) if (CAL[s].period[w] === period && wk[w] != null)
      (per.get(w) || per.set(w, []).get(w)).push(wk[w]);
  }
  const lo = [], med = [], hi = [], n = [];
  for (let w = 0; w < 52; w++) {
    const v = (per.get(w) || []).sort((a, b) => a - b);
    lo.push(v.length ? v[0] : null); hi.push(v.length ? v.at(-1) : null); n.push(v.length);
    med.push(v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null);
  }
  return {lo, med, hi, n};
}
// Outbreaks active at any time in week w of season s (open ones run to the as-of date).
function active(s, w, test = inFilter) {
  const a = day(CAL[s].start[w - 1]), b = day(CAL[s].end[w - 1]), out = [];
  for (let i = 0; i < N; i++) if (test(i) && BEGAN[i] <= b && (OVER[i] ?? ASOF) >= a) out.push(i);
  return out;
}
const pathogenLabel = i => O.type[i] === 2 ? "Other (e.g. CPE)"
  : O.type[i] === 1
    ? (O.mix[i] === DATA.mix_levels.indexOf("Multiple agents") ? "Multiple agents"
       : has(i, "Norovirus") ? "Norovirus" : has(i, "Unknown") ? "Unknown" : "Other enteric pathogen")
    : DATA.mix_levels[O.mix[i]];
const rawAgents = i => [O.a1[i], O.a2[i]].filter(a => a && a !== "None").join(" + ");

// ── header ────────────────────────────────────────────────────────────────
function freshness() {
  const asOf = new Date(ASOF), today = new Date(); today.setHours(0, 0, 0, 0);
  const back = ((today.getDay() - 3 + 7) % 7) || 7, exp = new Date(today); exp.setDate(today.getDate() - back);
  const wk = Math.round((exp - asOf) / (7 * 864e5));
  return wk <= 0 ? `<span class="fresh ok">up to date</span>`
    : `<span class="fresh stale">${wk} week${wk === 1 ? "" : "s"} behind the weekly refresh</span>`;
}
$("brand-sub").innerHTML = `City of Toronto Open Data · data as of ${fdate(ASOF)} · ${freshness()} · ` +
  `Open Government Licence – Toronto · unofficial`;
DATA.seasons.forEach((s, i) => { const o = document.createElement("option"); o.value = i;
  o.textContent = s + (isCurrent(i) ? " (current)" : ""); $("season").append(o); });
function seg(id, items, key) {
  $(id).innerHTML = items.map(([v, l]) => `<button data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join("");
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    S[key] = +b.dataset.v; $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
}
seg("seg-setting", [[-1, "All settings"], ...SETTINGS.map((s, i) => [i, s === "Retirement home" ? "Retirement" : s])], "setting");
seg("seg-type", [[0, "Respiratory"], [1, "Enteric"], [-1, "All types"]], "type");
$("season").onchange = e => { S.season = +e.target.value; S.week = Math.min(S.week, lastWeek(S.season)); render(); };
$("wk").oninput = e => { S.week = +e.target.value; render(); };
let timer = null;
$("play").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶"; return; }
  $("play").textContent = "❚❚";
  if (S.week >= lastWeek(S.season)) S.week = 1;
  timer = setInterval(() => { if (S.week >= lastWeek(S.season)) { $("play").click(); return; } S.week++; render(); }, 700);
};
function showTab(tb) {
  S.tab = tb;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tb));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + tb));
  render();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
function chips(id, items, key) {
  $(id).innerHTML = items.map(([v, l]) => `<button data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join("");
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => { S[key] = b.dataset.v; render(); });
}

// ── map ───────────────────────────────────────────────────────────────────
const map = L.map("lmap", {zoomControl: true, minZoom: 9, maxZoom: 18}).setView([43.715, -79.38], 11);
L.tileLayer(TILES.url, {attribution: TILES.attribution, maxZoom: 19}).addTo(map);
const layer = L.layerGroup().addTo(map);
map.fitBounds(L.latLngBounds(F.lat.map((la, k) => [la, F.lon[k]]).filter(p => p[0] != null)), {padding: [12, 12]});
new ResizeObserver(() => map.invalidateSize()).observe($("lmap"));
function drawMap(s, w) {
  layer.clearLayers();
  const act = active(s, w), byFac = new Map();
  for (const i of act) (byFac.get(O.fac[i]) || byFac.set(O.fac[i], []).get(O.fac[i])).push(i);
  // facilities with outbreaks earlier this season but none active now: faint context
  const earlier = new Set();
  for (let i = 0; i < N; i++) if (O.season[i] === s && inFilter(i) && O.week[i] <= w && !byFac.has(O.fac[i])) earlier.add(O.fac[i]);
  for (const f of earlier) if (F.lat[f] != null)
    L.circleMarker([F.lat[f], F.lon[f]], {radius: 3, color: css("--band"), weight: 1, fillColor: css("--band"),
      fillOpacity: 0.35, interactive: false}).addTo(layer);
  const ws = day(CAL[s].start[w - 1]);
  for (const [f, ids] of byFac) {
    if (F.lat[f] == null) continue;
    const isNew = ids.some(i => BEGAN[i] >= ws);
    const m = L.circleMarker([F.lat[f], F.lon[f]], {radius: 7, weight: isNew ? 3 : 1.5, opacity: 1,
      color: isNew ? css("--outline") : "#fff", fillColor: SCOL[F.setting[f]], fillOpacity: 0.95}).addTo(layer);
    m.bindTooltip(`<b>${esc(F.name[f])}</b><br><span style="color:var(--text-3)">${esc(SETTINGS[F.setting[f]])} · ${esc(F.hood[f])}</span><br>` +
      ids.map(i => `${esc(O.unit[i])}: ${esc(pathogenLabel(i))}, from ${fdateShort(BEGAN[i])}${OVER[i] == null ? ' <span class="open">open</span>' : ""}`).join("<br>") +
      `<br><span style="color:var(--text-3)">Click for this facility's history</span>`, {sticky: true});
    m.on("click", () => { S.sel = f; showTab("facility"); });
  }
  return {act, nFac: byFac.size};
}
$("legend").innerHTML = SETTINGS.map((s, i) => `<span><i class="dot" style="background:${SCOL[i]}"></i>${esc(s)}</span>`).join("") +
  `<span><i class="dot ring" style="background:#fff"></i>outbreak began this week</span>` +
  `<span><i class="dot" style="background:${css("--band")};opacity:.5;width:7px;height:7px"></i>outbreak earlier this season</span>` +
  `<span>All dots the same size: no bed counts to compare facilities fairly.</span>`;

// ── charts ────────────────────────────────────────────────────────────────
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.font.size = 11;
const charts = {};
function baseOpts(yTitle) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: {mode: "index", intersect: false},
    plugins: {legend: {display: false}},
    scales: {
      x: {grid: {display: false}, ticks: {color: css("--text-3"), maxRotation: 0, autoSkipPadding: 10},
          border: {color: css("--border")}},
      y: {beginAtZero: true, grid: {color: css("--grid")}, border: {display: false},
          ticks: {color: css("--text-3"), precision: 0}, title: {display: !!yTitle, text: yTitle, color: css("--text-3")}},
    },
  };
}
function upsert(key, cfg) { if (charts[key]) charts[key].destroy(); charts[key] = new Chart($(key), cfg); }
// Shaded provisional weeks and a rule at the selected week.
const weekMarks = {
  id: "weekMarks",
  beforeDatasetsDraw(c, _, o) {
    const {ctx, chartArea: a, scales: {x}} = c, half = (x.getPixelForValue(1) - x.getPixelForValue(0)) / 2;
    ctx.save();
    if (o.provFrom != null) {
      const p0 = x.getPixelForValue(o.provFrom) - half, p1 = x.getPixelForValue(o.provTo) + half;

function download(ids, name) {

  const lines = [CSV_COLS, ...ids.map(csvRow)].map(r => r.map(q).join(","));

const REPO = "https://github.com/samielsabri/toronto_healthcare_institutions_outbreaks";
$("about").innerHTML = `
<h3>What this shows</h3>
<p>Declared outbreaks in Toronto hospitals, long-term care homes (LTCH) and retirement homes, from the City of Toronto's open dataset <i>Outbreaks in Toronto Healthcare Institutions</i>, refreshed by Toronto Public Health every Thursday with data as of Wednesday afternoon. Updated automatically each week. An unofficial, independent summary; not produced or endorsed by Toronto Public Health.</p>
<h3>Counting</h3>
<ul>
<li>One outbreak per affected unit or ward, as published, by week of onset. Seasons run from ISO week 35 to week 34; week 53 is merged into week 52.</li>
<li>A facility is a physical site (one address, split by setting where an LTCH and a retirement home share it). Locations come from the City's Address Points register.</li>
<li>Pathogens are harmonized from the source labels. An outbreak with several pathogens counts under each in the season-onset series and as <i>Multiple agents</i> in the pathogen mix. "Coronavirus" in the source means seasonal coronaviruses, not COVID-19.</li>
<li>No case counts, attack rates or deaths are published, so everything is outbreak-level.</li>
</ul>
<h3>Comparison ranges</h3>
<ul>
<li>Testing and reporting changed during the pandemic, so a season is compared with two separate ranges: <b>pre-pandemic</b> (2016/17 to 2018/19, plus 2019/20 to ISO week 10 of 2020) and <b>post-pandemic</b> (2022/23 onward, excluding the current season). The band is the lowest to highest weekly count across those seasons; the line is the median.</li>
<li>The last two weeks of the current season are provisional: outbreaks are reported with a delay.</li>
</ul>
<h3>Season onset</h3>
<ul>
<li>Moving epidemic method (MEM) with default settings, fitted on the post-pandemic seasons, for influenza and RSV. The season starts in the first complete week above the epidemic threshold; higher lines mark medium, high and very high intensity. Weekly counts are small, so consecutive weeks above the threshold are the stronger signal.</li>
<li>COVID-19 has no stable seasonal pattern yet, so it is compared with the post-pandemic range without an alert.</li>
</ul>
<h3>Duration and repeat outbreaks</h3>
<ul>
<li>Duration: Kaplan–Meier, onset to declared over, for outbreaks beginning 2022/23 onward; open outbreaks are censored at the data-as-of date. Duration reflects the rules for declaring an outbreak over as well as transmission.</li>
<li>Repeat outbreaks: wards affected together are one <b>episode</b> (same type, same facility, each within 14 days of the previous one). A repeat is a later, separate episode in the same season. Facilities without any outbreak are not in the data, and counts are not adjusted for facility size.</li>
</ul>
<h3>Limitations</h3>
<ul>
<li>Outbreak counts reflect testing and reporting practices as well as disease activity. More outbreaks are declared per affected unit since 2020, and far more pathogens are identified.</li>
<li>Pathogen labels changed over the years (e.g. <i>Norovirus-like</i> to <i>Norovirus</i> in 2023) and were harmonized.</li>
<li>Recent weeks are incomplete; how much they grow will be quantified from the weekly snapshots as they accumulate.</li>
</ul>
<p>Every analytical decision is recorded in the <a href="${REPO}/blob/main/reports/decisions.md" target="_blank" rel="noopener">decisions log</a>; code and data are in the <a href="${REPO}" target="_blank" rel="noopener">project repository</a>.</p>
<h3>CSV columns</h3>
<p><code>season</code>, <code>season_week</code>, <code>iso_week</code>; <code>facility_*</code> and <code>neighbourhood</code> (derived site); <code>unit</code>, <code>setting</code>, <code>outbreak_type</code>; <code>causative_agent_1/2</code> (as published) and <code>pathogen_group</code> (harmonized); <code>date_began</code>, <code>date_declared_over</code>, <code>open</code>, <code>duration_days</code> (open outbreaks: days to the data-as-of date).</p>
<h3>Sources and licence</h3>
<p>Contains information licensed under the <a href="https://open.toronto.ca/open-data-license/" target="_blank" rel="noopener">Open Government Licence – Toronto</a>: <i>Outbreaks in Toronto Healthcare Institutions</i>, <i>Address Points (Municipal)</i> and <i>Neighbourhoods</i>. Basemap: ${TILES.attribution}. Built ${DATA.built}; data as of ${DATA.as_of}.</p>`;

    $("tb-title").textContent = `${DATA.seasons[s]}: ${fmt(ids.length)} ${TYPE_NAME()} outbreaks, ${SET_NAME()}`;
    $("tb-src").textContent = "Pathogens as published by Toronto Public Health; one row per affected unit. Newest first.";
    $("tbl").innerHTML = `<thead><tr><th>Onset</th><th>Facility</th><th>Unit</th><th>Setting</th><th>Pathogen(s)</th><th>Declared over</th><th class="n">Days</th></tr></thead><tbody>` +
      ids.map(i => `<tr><td class="nw">${O.began[i]}</td><td>${esc(F.name[O.fac[i]])}</td><td>${esc(O.unit[i])}</td><td>${esc(SETTINGS[O.setting[i]])}</td>
        <td>${esc(rawAgents(i))}</td><td class="nw">${OVER[i] == null ? '<span class="open">open</span>' : O.over[i]}</td>
        <td class="n">${fmt(((OVER[i] ?? ASOF) - BEGAN[i]) / 864e5)}</td></tr>`).join("") + "</tbody>";
  }
}
render();
</script>
</body>
</html>
