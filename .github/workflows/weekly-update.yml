# Weekly surveillance update.
#
# The City refreshes the data on Thursdays (data as of Wednesday 2 pm,
# published around 16:00 UTC). This runs at 18:00 UTC on Thursdays, when code
# that affects the site changes on main, and by hand from the Actions tab.
#
#   1. Download all annual files and save this week's snapshot, then commit
#      them straight away so a later failure never loses a snapshot.
#   2. Check inputs (schema, new labels), rebuild the cleaned data, run tests.
#   3. Render the Quarto site, commit the cleaned data, deploy to Pages.
#
# Any failure opens a GitHub issue labelled "pipeline-failure" (or comments
# on the open one), with the input-check report and the end of the log.

name: Weekly update

on:
  schedule:
    - cron: "0 18 * * 4"
  workflow_dispatch:
  # Also rebuild and redeploy when the site or pipeline code changes on main.
  # (The workflow's own data commits use GITHUB_TOKEN and do not re-trigger it.)
  push:
    branches: [main]
    paths:
      - "index.qmd"
      - "_quarto.yml"
      - "styles.css"
      - "R/**"
      - "scripts/**"
      - "data/reference/**"
      - ".github/workflows/weekly-update.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries (sf, used by opendatatoronto)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libcurl4-openssl-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.2"   # keep in step with renv.lock
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download data and save snapshot
        run: Rscript scripts/weekly_fetch.R 2>&1 | tee -a pipeline.log

      - name: Commit raw data and snapshot
        run: |
          {
          # If no data file changed, drop the manifest's new download time so
          # unchanged weeks do not produce a commit.
          # (git status, not git diff, so a new file such as next year's is seen)
          if [ -z "$(git status --porcelain -- data/raw ':!data/raw/manifest.csv' data/snapshots)" ]; then
            git checkout -- data/raw/manifest.csv
          fi
          git add data/raw data/snapshots
          if ! git diff --cached --quiet; then
            refresh=$(tail -n 1 data/raw/manifest.csv | awk -F, '{print $NF}')
            git commit -m "Data: City refresh ${refresh}"
            # main may have moved during the run (e.g. a code push): rebase first
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No new data since the last run."
          fi
          } 2>&1 | tee -a pipeline.log

      - name: Check inputs (schema and labels)
        run: Rscript scripts/check_inputs.R 2>&1 | tee -a pipeline.log

      - name: Build cleaned data
        run: Rscript scripts/03_clean.R 2>&1 | tee -a pipeline.log

      - name: Geocode new facility addresses
        run: |
          Rscript scripts/geocode_facilities.R 2>&1 | tee -a pipeline.log
          Rscript scripts/03_clean.R 2>&1 | tee -a pipeline.log   # attach any new coordinates

      - name: Run tests
        run: Rscript tests/run_tests.R 2>&1 | tee -a pipeline.log

      - name: Render site
        run: quarto render 2>&1 | tee -a pipeline.log

      - name: Commit cleaned data
        run: |
          {
          git add data/clean reports/tables data/reference/facility_geocodes.csv
          if ! git diff --cached --quiet; then
            git commit -m "Build: cleaned data for City refresh $(tail -n 1 data/raw/manifest.csv | awk -F, '{print $NF}')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          } 2>&1 | tee -a pipeline.log

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Report warnings as a GitHub issue
        if: success() && hashFiles('pipeline_warnings.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly update ran and deployed, with warnings, on $(date -u +%F). Run: ${RUN_URL}"
            echo
            cat pipeline_warnings.md
          } > warn_body.md
          gh label create pipeline-warning --color FBCA04 \
            --description "Automated: the weekly update needs attention" --force
          open_issue=$(gh issue list --label pipeline-warning --state open --json number --jq '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body-file warn_body.md
          else
            gh issue create --title "Weekly update: warnings" --label pipeline-warning --body-file warn_body.md
          fi

      - name: Open or update a GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if grep -q "### Failures" pipeline_check.md 2>/dev/null; then
            title="Weekly update stopped: input check failed (schema or label change)"
          else
            title="Weekly update failed"
          fi
          {
            echo "The weekly update failed on $(date -u +%F). Run: ${RUN_URL}"
            echo
            if [ -s pipeline_check.md ]; then cat pipeline_check.md; echo; fi
            echo "<details><summary>Last 80 lines of the log</summary>"
            echo
            echo '```'
            tail -n 80 pipeline.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "</details>"
          } > issue_body.md
          gh label create pipeline-failure --color B60205 \
            --description "Automated: the weekly update failed" --force
          open_issue=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body-file issue_body.md
          else
            gh issue create --title "$title" --label pipeline-failure --body-file issue_body.md
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The build job opens its own issue when it fails; this covers a build that
  # succeeded but could not be deployed (e.g. Pages settings or permissions).
  report-deploy-failure:
    needs: [build, deploy]
    if: failure() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The weekly build succeeded but deploying the site to GitHub Pages failed on $(date -u +%F). The data were updated; the public page was not. Run: ${RUN_URL}"
          gh label create pipeline-failure --color B60205 \
            --description "Automated: the weekly update failed" --force
          open_issue=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "Weekly update: site deploy failed" --label pipeline-failure --body "$body"
          fi
